
name: Build and deploy ping-pong8

on:
  push:
    branches:
      - main
    paths-ignore:
      - "manifest/**"
      - ".github/workflows/**"
      - "README.md"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ping-pong8-production
  cancel-in-progress: false

env:
  SERVER_DOCKERFILE: server/Dockerfile.logger
  PINGPONG_DOCKERFILE: Dockerfile.pingpong

jobs:
  build-server:
    name: Build server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile.logger
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ping-pong8-server:${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  build-pingpong:
    name: Build ping-pong image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ping-pong
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.pingpong
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ping-pong8-pingpong:${{ github.sha }}
          cache-from: type=gha,scope=pingpong
          cache-to: type=gha,mode=max,scope=pingpong

  update-manifest:
    name: Update deployment manifests
    needs:
      - build-server
      - build-pingpong

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install yq
        shell: bash
        run: |
          sudo curl -fsSL \
            https://github.com/mikefarah/yq/releases/download/v4.45.4/yq_linux_amd64 \
            -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version


      - name: Update image references in manifests
        shell: bash
        env:
          SERVER_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ping-pong8-server:${{ github.sha }}
          PINGPONG_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ping-pong8-pingpong:${{ github.sha }}
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            echo "Updating $file"

            yq -i '
              (
                select(.kind == "Rollout" or .kind == "Deployment")
                | .spec.template.spec.containers[]
                | select(.name == "server")
                | .image
              ) = strenv(SERVER_IMAGE) |
              (
                select(.kind == "Rollout" or .kind == "Deployment")
                | .spec.template.spec.containers[]
                | select(.name == "ping-pong")
                | .image
              ) = strenv(PINGPONG_IMAGE)
            ' "$file"

          done < <(
            find manifest -type f \
              \( -name '*.yaml' -o -name '*.yml' \) \
              -print0
          )
      
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifest/

          if git diff --cached --quiet; then
            echo "No manifest changes detected."
            exit 0
          fi

          git commit -m "chore: deploy ${GITHUB_SHA}"

          git push origin HEAD:main
