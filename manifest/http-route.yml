apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: combined-app-route
  namespace: exercises
spec:
  parentRefs:
    - name: ako-gateway
  rules:
    # Rule 1: Match /pingpong, strip the prefix, and send to ako-ping-pong-svc
    - matches:
        - path:
            type: PathPrefix
            value: /pingpong
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: ako-ping-pong-svc
          port: 1238

    # Rule 2: Match /logger, strip the prefix, and send to ako-log-server-svc
    - matches:
        - path:
            type: PathPrefix
            value: /logger
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: ako-log-server-svc
          port: 1235

    # Rule 2: Match root / and send directly to ako-log-server-svc
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ako-log-server-svc
          port: 1235